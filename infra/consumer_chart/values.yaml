serviceTree:
  landscape: lapras
  platform: nitroso
  service: tin
  module: consumer

stateful: false

# run the module as a scheduled CronJob instead of a long-lived workload
# (Deployment/StatefulSet are not rendered when enabled)
cronjob:
  enabled: false
  schedule: '30 19 * * *'
  timeZone: ''
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  activeDeadlineSeconds: 0

replicaCount: 1
appSettings: {}

configMountPath: /app/config

image:
  repository: golang-chart
  pullPolicy: IfNotPresent
  tag: ''

env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

jobRbac:
  create: false
  annotations: {}

serviceAccount:
  create: false
  annotations: {}
  name: ''

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources: {}

autoscaling: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: {}
